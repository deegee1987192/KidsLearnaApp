<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Homework Quest — Wiz's Adventure Hub</title>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#1A237E">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="homework.css">
</head>
<body>

<div id="scene" class="day">
  <div class="sun"></div>
  <div class="moon"></div>
  <div class="stars-wrap" id="starsWrap"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div class="hills">
    <div class="hill hill1"></div>
    <div class="hill hill2"></div>
    <div class="hill hill3"></div>
  </div>
</div>

<div id="confetti"></div>

<button id="hwGear" class="hw-gear hidden" type="button" aria-label="Parent settings">⚙️</button>

<div id="app" class="hw-app">
  <div id="wizHost"></div>
  <main id="hwRoot"></main>
</div>

<script>window.KL_BG_MUSIC = false; /* background music would talk over Wiz */</script>
<script src="../js/core/util.js"></script>
<script src="../js/core/scene.js"></script>
<script src="../js/core/wiz.js"></script>
<script src="../js/core/confetti.js"></script>
<script src="../js/core/audio.js"></script>
<script src="js/hw-util.js"></script>
<script src="js/db.js"></script>
<script src="js/speech.js"></script>
<script src="js/pets.js"></script>
<script src="js/map.js"></script>
<script src="js/visuals.js"></script>
<script src="js/fallback-missions.js"></script>
<script src="js/missions.js"></script>
<script src="js/screens.js"></script>
<script src="js/app.js"></script>
</body>
</html>
