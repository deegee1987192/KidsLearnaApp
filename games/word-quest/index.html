<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wiz's Word Quest 🦉</title>
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/word-quest.css">
</head>
<body>

<div id="scene" class="day">
  <div class="sun"></div>
  <div class="moon"></div>
  <div class="stars-wrap" id="starsWrap"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div class="hills">
    <div class="hill hill1"></div>
    <div class="hill hill2"></div>
    <div class="hill hill3"></div>
  </div>
  <div class="tree" style="left:5%;bottom:55px"><div class="tree-top"></div><div class="tree-trunk"></div></div>
  <div class="tree" style="right:8%;bottom:60px"><div class="tree-top" style="width:50px;height:60px"></div><div class="tree-trunk"></div></div>
</div>

<div id="confetti"></div>

<a href="../../index.html" class="back-hub">← Home</a>

<div id="app">
  <div class="hdr"><div class="logo">⭐ Wiz's Word Quest</div></div>

  <div id="wizHost"></div>

  <!-- START -->
  <div id="wqStart" class="screen">
    <div class="big-e">🦉✨</div>
    <h1>Wiz's Word Quest!</h1>
    <p>20 levels of learning fun!<br>
       Spell words ✏️ · Read 📖 · Crack codes 🔐<br>
       Math 🔢 · Puzzles 🧩 — and sports mini-games! 🏀⚽</p>
    <button class="play-btn" id="wqStartBtn">Let's Go! 🚀</button>
  </div>

  <!-- GAME -->
  <div id="wqGame" class="hidden" style="width:100%">
    <div class="wq-hud">
      <div class="wq-pill" id="wqLevel">Level 1</div>
      <div class="wq-pill">🎮 <span id="wqQnum">1/10</span></div>
      <div class="wq-pill">⭐ <span id="wqStars">0</span></div>
    </div>
    <div class="wq-progwrap"><div class="wq-prog" id="wqProg" style="width:0%"></div></div>

    <div class="card wq-card">
      <div class="wq-badge badge-fill" id="wqBadge">FILL</div>
      <div id="wqCardBody"></div>
      <div class="wq-feedback" id="wqFeedback"></div>
      <button class="wq-next hidden" id="wqNext">Next ➜</button>
    </div>
  </div>

  <!-- END -->
  <div id="wqEnd" class="screen hidden">
    <div class="big-e" id="wqEndEmoji">🏆</div>
    <h1 id="wqEndTitle">Amazing!</h1>
    <p>You earned <span id="wqEndStars">0 / 200</span> stars!<br>Wiz is so proud of you! 🦉❤️</p>
    <button class="play-btn" id="wqAgain">Play Again 🎮</button>
  </div>
</div>

<script src="../../js/core/util.js"></script>
<script src="../../js/core/scene.js"></script>
<script src="../../js/core/wiz.js"></script>
<script src="../../js/core/confetti.js"></script>
<script src="../../js/core/audio.js"></script>

<script src="../../js/word-quest/rewards.js"></script>
<script src="../../js/word-quest/rewards/soccer.js"></script>
<script src="../../js/word-quest/rewards/basketball.js"></script>
<script src="../../js/word-quest/rewards/baseball.js"></script>
<script src="../../js/word-quest/rewards/hockey.js"></script>
<script src="../../js/word-quest/rewards/fieldgoal.js"></script>
<script src="../../js/word-quest/rewards/tennis.js"></script>
<script src="../../js/word-quest/rewards/balloonpop.js"></script>
<script src="../../js/word-quest/rewards/fruitcatch.js"></script>
<script src="../../js/word-quest/rewards/whackamole.js"></script>
<script src="../../js/word-quest/rewards/rocket.js"></script>
<script src="../../js/word-quest/rewards/cardodge.js"></script>

<script src="../../js/word-quest/wordbank.js"></script>
<script src="../../js/word-quest/levels.js"></script>
<script src="../../js/word-quest/questions.js"></script>
<script src="../../js/word-quest/main.js"></script>
<script>
  KL.wiz.mount(document.getElementById('wizHost'), 'Ready for a quest? 🦉');
  KL.wordQuest.boot();
</script>
</body>
</html>
