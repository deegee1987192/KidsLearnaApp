<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wiz's Word Quest 🦉</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Fredoka+One&display=swap');

:root {
  --sky1:#87CEEB; --sky2:#B0E0FF;
  --sun:#FFD700; --moon:#FFF8DC;
  --grass:#5DBB63; --grass2:#3A9940;
  --cloud:#fff;
  --navy:#1A237E; --navy2:#283593;
  --coral:#FF6B4A; --coral2:#E64A19;
  --gold:#FFB300; --gold2:#FF8F00;
  --mint:#4CAF82; --mint2:#388E60;
  --purple:#7C4DFF; --purple2:#5E35B1;
  --card:#FFFDE7; --card2:#FFF9C4;
  --white:#fff;
  --txt:#1A237E;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Nunito',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
  display:flex;flex-direction:column;align-items:center;
  position:relative;
}

/* ═══ ANIMATED BACKGROUNDS ═══ */
#scene{
  position:fixed;inset:0;z-index:0;
  transition:background 1s ease;
}

/* Default: day sky */
#scene.day{background:linear-gradient(180deg,#87CEEB 0%,#B0E2FF 60%,#C8F0A0 85%,#5DBB63 100%)}
#scene.night{background:linear-gradient(180deg,#0D1B4B 0%,#1A2D6B 60%,#1E3A1E 85%,#2D5A2D 100%)}
#scene.jungle{background:linear-gradient(180deg,#1B5E20 0%,#2E7D32 40%,#388E3C 75%,#1B5E20 100%)}
#scene.space{background:linear-gradient(180deg,#0A0A2E 0%,#1A1A4E 50%,#0D2137 85%,#0A1628 100%)}
#scene.candy{background:linear-gradient(180deg,#FCE4EC 0%,#F8BBD0 40%,#E1BEE7 75%,#CE93D8 100%)}

/* Sun */
.sun{
  position:absolute;top:30px;right:60px;
  width:80px;height:80px;
  background:radial-gradient(circle,#FFE566,#FFB300);
  border-radius:50%;
  box-shadow:0 0 40px #FFD70088;
  animation:sunPulse 4s ease-in-out infinite;
}
@keyframes sunPulse{0%,100%{box-shadow:0 0 40px #FFD70088}50%{box-shadow:0 0 70px #FFD700CC}}

/* Moon */
.moon{
  position:absolute;top:30px;right:60px;
  width:70px;height:70px;
  background:#FFF8DC;border-radius:50%;
  box-shadow:0 0 30px #FFF8DC88;
  display:none;
}
.night .moon{display:block}
.night .sun{display:none}

/* Clouds */
.cloud{
  position:absolute;
  background:white;border-radius:50px;
  opacity:0.9;
  animation:drift linear infinite;
}
.cloud::before,.cloud::after{
  content:'';position:absolute;background:white;border-radius:50%;
}
.cloud.c1{width:100px;height:35px;top:60px;animation-duration:28s;animation-delay:-5s}
.cloud.c1::before{width:50px;height:50px;top:-25px;left:15px}
.cloud.c1::after{width:35px;height:35px;top:-18px;left:45px}
.cloud.c2{width:140px;height:40px;top:110px;animation-duration:40s;animation-delay:-15s;opacity:0.75}
.cloud.c2::before{width:65px;height:55px;top:-30px;left:20px}
.cloud.c2::after{width:45px;height:40px;top:-22px;left:65px}
.cloud.c3{width:80px;height:28px;top:40px;animation-duration:55s;animation-delay:-30s;opacity:0.6}
.cloud.c3::before{width:38px;height:38px;top:-20px;left:12px}
.cloud.c3::after{width:28px;height:28px;top:-14px;left:38px}
@keyframes drift{from{left:-200px}to{left:110vw}}

/* Stars (night/space) */
.stars-wrap{position:absolute;inset:0;pointer-events:none;display:none}
.night .stars-wrap,.space .stars-wrap{display:block}
.star-dot{
  position:absolute;background:white;border-radius:50%;
  animation:twinkle ease-in-out infinite;
}
@keyframes twinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.2;transform:scale(0.5)}}

/* Ground hills */
.hills{
  position:absolute;bottom:0;left:0;right:0;height:120px;
  overflow:hidden;
}
.hill{
  position:absolute;bottom:0;
  border-radius:50% 50% 0 0;
  opacity:0.5;
}
.hill1{width:300px;height:100px;left:-50px;background:#3A9940}
.hill2{width:400px;height:120px;left:150px;background:#2E7D32}
.hill3{width:350px;height:90px;right:-30px;background:#388E3C}

/* Trees */
.tree{position:absolute;bottom:60px}
.tree-trunk{width:16px;height:40px;background:#795548;margin:0 auto;border-radius:4px}
.tree-top{width:60px;height:70px;background:#2E7D32;border-radius:50% 50% 40% 40%;margin:0 auto;position:relative;top:10px}

/* Jungle vines */
.vine{
  position:absolute;top:0;width:8px;
  background:linear-gradient(#2E7D32,#1B5E20);
  border-radius:4px;
  animation:swingVine 3s ease-in-out infinite;
  transform-origin:top center;
}
@keyframes swingVine{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}

/* Space objects */
.planet{
  position:absolute;border-radius:50%;
  animation:floatPlanet 6s ease-in-out infinite;
}
@keyframes floatPlanet{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.rocket{
  position:absolute;font-size:2.5rem;
  animation:rocketFly 8s linear infinite;
}
@keyframes rocketFly{from{left:-60px;top:20%}to{left:110vw;top:10%}}

/* Candy */
.lollipop{position:absolute;font-size:2.5rem;animation:bounce 2s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-10px) rotate(5deg)}}

/* ═══ OWL MASCOT ═══ */
.wiz-wrap{
  position:relative;z-index:10;
  display:flex;align-items:flex-end;gap:12px;
  margin-bottom:4px;
  width:100%;max-width:580px;
  padding:0 8px;
}
.wiz{
  flex-shrink:0;
  width:80px;height:80px;
  position:relative;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,0.2));
  transition:transform 0.3s;
}
.wiz.happy{animation:wizBounce 0.6s ease}
.wiz.sad{animation:wizShake 0.5s ease}
.wiz.idle{animation:wizFloat 3s ease-in-out infinite}
@keyframes wizBounce{0%,100%{transform:scale(1)}30%{transform:scale(1.3) rotate(-10deg)}60%{transform:scale(0.9) rotate(5deg)}}
@keyframes wizShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes wizFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

.wiz-bubble{
  background:white;
  border-radius:18px 18px 18px 4px;
  padding:10px 16px;
  font-family:'Fredoka One',cursive;
  font-size:1rem;
  color:var(--navy);
  box-shadow:0 4px 16px rgba(0,0,0,0.12);
  max-width:340px;
  line-height:1.3;
  opacity:0;
  transform:translateY(6px);
  transition:opacity 0.3s,transform 0.3s;
}
.wiz-bubble.show{opacity:1;transform:translateY(0)}

/* ═══ LAYOUT ═══ */
#app{
  position:relative;z-index:5;
  width:100%;max-width:600px;
  padding:12px 12px 24px;
  display:flex;flex-direction:column;align-items:center;
  min-height:100vh;
}

/* ═══ HEADER ═══ */
.hdr{text-align:center;padding:12px 0 6px}
.logo{
  font-family:'Fredoka One',cursive;
  font-size:clamp(1.8rem,5vw,2.8rem);
  color:white;
  text-shadow:3px 3px 0 rgba(0,0,0,0.2),0 0 20px rgba(255,255,255,0.3);
  letter-spacing:2px;
}

/* ═══ HUD ═══ */
.hud{
  display:flex;gap:10px;justify-content:center;
  flex-wrap:wrap;margin:8px 0 10px;
  width:100%;
}
.hud-pill{
  background:rgba(255,255,255,0.92);
  backdrop-filter:blur(4px);
  border-radius:99px;padding:6px 18px;
  font-family:'Fredoka One',cursive;font-size:1.1rem;
  box-shadow:0 3px 0 rgba(0,0,0,0.12);
  color:var(--navy);display:flex;align-items:center;gap:5px;
}

/* progress */
.prog-wrap{
  width:100%;background:rgba(255,255,255,0.4);
  border-radius:99px;height:12px;margin-bottom:10px;
  overflow:hidden;
}
.prog-bar{
  height:100%;border-radius:99px;
  background:linear-gradient(90deg,#FFB300,#FF6B4A);
  transition:width 0.5s ease;
}

/* ═══ CARD ═══ */
.card{
  background:rgba(255,253,231,0.97);
  border-radius:28px;
  padding:28px 20px 22px;
  width:100%;
  box-shadow:0 8px 0 rgba(0,0,0,0.15),0 14px 40px rgba(0,0,0,0.12);
  position:relative;
  animation:cardIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes cardIn{from{opacity:0;transform:translateY(40px) scale(0.92)}to{opacity:1;transform:none}}

.card-badge{
  position:absolute;top:-15px;left:50%;transform:translateX(-50%);
  padding:4px 22px;border-radius:99px;
  font-family:'Fredoka One',cursive;font-size:0.85rem;letter-spacing:1px;
  color:white;white-space:nowrap;
  box-shadow:0 3px 0 rgba(0,0,0,0.15);
}
.badge-fill{background:#29B6F6}
.badge-code{background:#7C4DFF}
.badge-logic{background:#FF6B4A}
.badge-math{background:#4CAF82}
.badge-sight{background:#5C6BC0}

.q-text{
  font-family:'Fredoka One',cursive;
  font-size:clamp(1.3rem,3.8vw,1.9rem);
  color:var(--navy);text-align:center;
  line-height:1.35;margin:8px 0 20px;
}
.q-text .hl{
  color:#FF6B4A;background:#FFF3E0;
  padding:2px 12px;border-radius:10px;display:inline-block;
}
.q-text .blank-box{
  display:inline-block;
  min-width:1.4ch;border-bottom:5px solid #29B6F6;
  color:#29B6F6;text-align:center;
  font-size:1.1em;margin:0 3px;
  vertical-align:bottom;
}

/* cipher row */
.cipher-row{
  display:flex;flex-wrap:wrap;gap:8px;
  justify-content:center;margin-bottom:18px;
}
.cipher-chip{
  background:#E8EAF6;border-radius:10px;
  padding:6px 12px;
  font-family:'Fredoka One',cursive;font-size:1rem;
  color:var(--navy);
  box-shadow:inset 0 2px 0 rgba(255,255,255,0.8);
}

/* word display for code cracker */
.code-word{
  display:flex;gap:10px;justify-content:center;
  flex-wrap:wrap;margin-bottom:18px;
}
.code-cell{
  width:52px;height:64px;
  background:white;border-radius:14px;
  box-shadow:0 3px 0 rgba(0,0,0,0.12);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;
  font-family:'Fredoka One',cursive;
}
.code-num{font-size:1.4rem;color:#7C4DFF}
.code-letter{font-size:1.2rem;color:var(--navy);min-height:1.4rem}

/* answer grid */
.answers{display:grid;gap:10px;margin-top:4px}
.answers.g2{grid-template-columns:1fr 1fr}
.answers.g1{grid-template-columns:1fr}

.abtn{
  font-family:'Fredoka One',cursive;
  font-size:clamp(1rem,3.2vw,1.4rem);
  padding:14px 10px;border:none;border-radius:16px;
  cursor:pointer;
  box-shadow:0 5px 0 rgba(0,0,0,0.15);
  transition:transform 0.1s,box-shadow 0.1s;
  line-height:1.2;
}
.abtn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 7px 0 rgba(0,0,0,0.15)}
.abtn:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,0.12)}
.abtn:disabled{cursor:default}
.abtn.correct{background:#66BB6A!important;color:white!important;transform:scale(1.05)!important}
.abtn.wrong{background:#EF5350!important;color:white!important;opacity:0.7}
.abtn.revealed{background:#A5D6A7!important;color:white!important}

.ac1{background:#4FC3F7;color:white}
.ac2{background:#FFD54F;color:#1A237E}
.ac3{background:#66BB6A;color:white}
.ac4{background:#CE93D8;color:white}
.ac5{background:#FF8A65;color:white}

/* letter picker */
.letter-grid{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.lbtn{
  font-family:'Fredoka One',cursive;font-size:1.8rem;
  width:62px;height:62px;border-radius:16px;border:none;
  cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,0.15);
  transition:transform 0.1s;color:white;
}
.lbtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,0.12)}
.lb1{background:#4FC3F7}.lb2{background:#FFB300;color:#1A237E}
.lb3{background:#66BB6A}.lb4{background:#CE93D8}.lb5{background:#FF6B4A}

/* math emoji counter */
.emoji-counter{
  display:flex;flex-wrap:wrap;gap:6px;justify-content:center;
  font-size:2rem;margin-bottom:14px;
  min-height:2.5rem;
  transition:all 0.3s;
}

/* feedback */
.feedback{
  text-align:center;font-family:'Fredoka One',cursive;
  font-size:1.5rem;min-height:2rem;margin-top:14px;
  transition:opacity 0.3s;
}
.feedback.ok{color:#388E3C}
.feedback.no{color:#C62828}

/* next button */
.next-btn{
  display:block;margin:16px auto 0;
  font-family:'Fredoka One',cursive;font-size:1.2rem;
  padding:13px 40px;background:var(--navy);color:white;
  border:none;border-radius:99px;cursor:pointer;
  box-shadow:0 5px 0 #0D1B6E;
  transition:transform 0.1s,box-shadow 0.1s;
  letter-spacing:1px;
}
.next-btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 #0D1B6E}
.next-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0D1B6E}

/* ═══ SCREENS ═══ */
.screen{
  width:100%;max-width:560px;
  background:rgba(255,253,231,0.97);
  border-radius:28px;padding:36px 24px;
  text-align:center;
  box-shadow:0 8px 0 rgba(0,0,0,0.15),0 14px 40px rgba(0,0,0,0.12);
  animation:cardIn 0.4s ease;
}
.screen h1{font-family:'Fredoka One',cursive;font-size:2.4rem;color:var(--navy);margin-bottom:10px}
.screen p{font-size:1.05rem;color:#5C6BC0;font-weight:700;line-height:1.6;margin-bottom:22px}
.big-e{font-size:5rem;margin-bottom:10px}

.start-btn,.play-btn{
  font-family:'Fredoka One',cursive;font-size:1.4rem;
  padding:15px 48px;background:var(--coral);color:white;
  border:none;border-radius:99px;cursor:pointer;
  box-shadow:0 6px 0 var(--coral2);letter-spacing:1px;
  transition:transform 0.15s;
}
.start-btn:hover,.play-btn:hover{transform:scale(1.05)}

/* ═══ CONFETTI ═══ */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden}
.cbit{
  position:absolute;border-radius:3px;
  animation:cffall linear forwards;
}
@keyframes cffall{
  0%{transform:translateY(-20px) rotate(0deg);opacity:1}
  100%{transform:translateY(110vh) rotate(720deg);opacity:0}
}

/* ═══ UTILS ═══ */
.hidden{display:none!important}
.mt8{margin-top:8px}

/* difficulty dots */
.diff-row{display:flex;justify-content:center;gap:6px;margin-bottom:14px}
.diff-dot{width:12px;height:12px;border-radius:50%;background:#E0E0E0}
.diff-dot.on{background:#FFB300}

/* pattern row */
.pattern-row{
  display:flex;gap:8px;flex-wrap:wrap;
  justify-content:center;margin-bottom:16px;font-size:2.2rem;
}
.pattern-cell{
  width:52px;height:52px;border-radius:12px;
  background:white;box-shadow:0 3px 0 rgba(0,0,0,0.1);
  display:flex;align-items:center;justify-content:center;
  font-size:1.8rem;
}
.pattern-cell.mystery{
  background:#E8EAF6;border:3px dashed #7C4DFF;
  font-size:1.4rem;color:#7C4DFF;font-family:'Fredoka One',cursive;
}
</style>
</head>
<body>

<!-- SCENE -->
<div id="scene" class="day">
  <div class="sun"></div>
  <div class="moon"></div>
  <div class="stars-wrap" id="starsWrap"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div class="hills">
    <div class="hill hill1"></div>
    <div class="hill hill2"></div>
    <div class="hill hill3"></div>
  </div>
  <div class="tree" style="left:5%;bottom:55px"><div class="tree-top"></div><div class="tree-trunk"></div></div>
  <div class="tree" style="right:8%;bottom:60px"><div class="tree-top" style="width:50px;height:60px"></div><div class="tree-trunk"></div></div>
</div>

<!-- CONFETTI -->
<div id="confetti"></div>

<a href="../index.html" style="position:fixed;top:14px;left:14px;z-index:20;background:rgba(255,255,255,0.92);border:none;border-radius:99px;padding:8px 16px;font-family:'Fredoka One',cursive;font-size:0.95rem;color:#1A237E;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,0.12);text-decoration:none;">← Home</a>

<div id="app">

  <!-- START SCREEN -->
  <div class="screen" id="startScreen">
    <div class="big-e">🦉✨</div>
    <h1>Wiz's Word Quest!</h1>
    <p>Join Wiz the owl on a learning adventure!<br>
    Crack codes 🔐 · Solve puzzles 🧩<br>
    Fill in words ✏️ · Master math 🔢</p>
    <button class="start-btn" onclick="startGame()">Let's Go! 🚀</button>
  </div>

  <!-- GAME SCREEN -->
  <div id="gameScreen" class="hidden" style="width:100%">
    <div class="hdr">
      <div class="logo">⭐ Wiz's Word Quest</div>
    </div>
    <div class="hud">
      <div class="hud-pill">⭐ <span id="scoreEl">0</span></div>
      <div class="hud-pill">❤️ <span id="livesEl">3</span></div>
      <div class="hud-pill">🎮 <span id="qEl">1</span>/<span id="totalEl">12</span></div>
    </div>
    <div class="prog-wrap"><div class="prog-bar" id="progBar" style="width:0%"></div></div>

    <!-- Wiz mascot -->
    <div class="wiz-wrap">
      <div class="wiz idle" id="wiz">
        <svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" width="80" height="80">
          <!-- body -->
          <ellipse cx="40" cy="52" rx="26" ry="24" fill="#7C4DFF"/>
          <!-- wings -->
          <ellipse cx="16" cy="56" rx="12" ry="7" fill="#5E35B1" transform="rotate(-20,16,56)"/>
          <ellipse cx="64" cy="56" rx="12" ry="7" fill="#5E35B1" transform="rotate(20,64,56)"/>
          <!-- belly -->
          <ellipse cx="40" cy="57" rx="16" ry="14" fill="#EDE7F6"/>
          <!-- head -->
          <ellipse cx="40" cy="30" rx="22" ry="20" fill="#7C4DFF"/>
          <!-- ear tufts -->
          <polygon points="24,14 20,4 30,12" fill="#5E35B1"/>
          <polygon points="56,14 60,4 50,12" fill="#5E35B1"/>
          <!-- face -->
          <!-- left eye -->
          <circle cx="30" cy="28" r="9" fill="white"/>
          <circle cx="30" cy="28" r="6" fill="#FFB300"/>
          <circle cx="30" cy="28" r="3.5" fill="#1A237E"/>
          <circle cx="31.5" cy="26.5" r="1.5" fill="white"/>
          <!-- right eye -->
          <circle cx="50" cy="28" r="9" fill="white"/>
          <circle cx="50" cy="28" r="6" fill="#FFB300"/>
          <circle cx="50" cy="28" r="3.5" fill="#1A237E"/>
          <circle cx="51.5" cy="26.5" r="1.5" fill="white"/>
          <!-- beak -->
          <polygon points="40,33 36,40 44,40" fill="#FFB300"/>
          <!-- graduation cap -->
          <rect x="22" y="12" width="36" height="5" rx="2" fill="#1A237E"/>
          <rect x="36" y="8" width="8" height="6" rx="1" fill="#1A237E"/>
          <line x1="55" y1="14" x2="58" y2="22" stroke="#FFB300" stroke-width="2"/>
          <circle cx="58" cy="23" r="3" fill="#FFB300"/>
          <!-- feet -->
          <ellipse cx="33" cy="74" rx="8" ry="4" fill="#FFB300"/>
          <ellipse cx="47" cy="74" rx="8" ry="4" fill="#FFB300"/>
        </svg>
      </div>
      <div class="wiz-bubble" id="wizBubble">Ready to learn? Let's go! 🎉</div>
    </div>

    <div class="card" id="gameCard">
      <div class="card-badge" id="cardBadge">FILL THE BLANK</div>
      <div class="diff-row" id="diffRow"></div>
      <div id="emojiCounterWrap" class="hidden">
        <div class="emoji-counter" id="emojiCounter"></div>
      </div>
      <div class="q-text" id="qText"></div>
      <div id="cipherArea" class="hidden">
        <div class="cipher-row" id="cipherRow"></div>
        <div class="code-word" id="codeWord"></div>
      </div>
      <div id="patternArea" class="hidden">
        <div class="pattern-row" id="patternRow"></div>
      </div>
      <div id="answersArea"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn hidden" id="nextBtn" onclick="nextQ()">Next ➜</button>
    </div>
  </div>

  <!-- END SCREEN -->
  <div class="screen hidden" id="endScreen">
    <div class="big-e" id="endEmoji">🏆</div>
    <h1 id="endTitle">Amazing!</h1>
    <p id="endMsg"></p>
    <button class="play-btn" onclick="restartGame()">Play Again! 🎮</button>
  </div>

let score=0,lives=3,qIdx=0,answered=false,queue=[];
const TOTAL=12;

const WIZ_OK  =['Great job! ⭐','You nailed it! 🎉','Brilliant! 🌟','Woo-hoo! 🏆','Super smart! 💪','Amazing! 🦄'];

// ═══════════════════════════════════════════════
// SCENE MANAGEMENT
// ═══════════════════════════════════════════════
function setScene(name){
  const s=document.getElementById('scene');
  s.className=name||'day';
  // manage extra elements
  document.querySelectorAll('.vine,.planet,.rocket,.lollipop').forEach(e=>e.remove());
  if(name==='jungle'){
    for(let i=0;i<4;i++){
      const v=document.createElement('div');
      v.className='vine';
      v.style.cssText=`height:${80+Math.random()*120}px;left:${Math.random()*90}%;animation-delay:${Math.random()*2}s`;
      s.appendChild(v);
    }
  }
  if(name==='space'){
    buildStars(50);
    for(let i=0;i<2;i++){
      const p=document.createElement('div');
      p.className='planet';
      const colors=['#CE93D8','#80CBC4','#FFB74D'];
      const sz=30+Math.random()*40;
      p.style.cssText=`width:${sz}px;height:${sz}px;background:${colors[i%3]};top:${10+Math.random()*30}%;left:${10+Math.random()*70}%;animation-delay:${i*2}s`;
      s.appendChild(p);
    }
    const r=document.createElement('div');
    r.className='rocket';r.textContent='🚀';
    s.appendChild(r);
  }
  if(name==='candy'){
    ['🍭','🍬','🍰'].forEach((e,i)=>{
      const l=document.createElement('div');
      l.className='lollipop';l.textContent=e;
      l.style.cssText=`bottom:${80+i*40}px;left:${10+i*30}%;font-size:2rem;position:absolute;animation-delay:${i*0.6}s`;
      s.appendChild(l);
    });
  }
  if(name==='night') buildStars(30);
}

function buildStars(n){
  const wrap=document.getElementById('starsWrap');
  wrap.innerHTML='';
  for(let i=0;i<n;i++){
    const d=document.createElement('div');
    d.className='star-dot';
    const sz=2+Math.random()*3;
    d.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*70}%;left:${Math.random()*100}%;animation-duration:${1.5+Math.random()*2.5}s;animation-delay:${Math.random()*3}s`;
    wrap.appendChild(d);
  }
}

// ═══════════════════════════════════════════════
// WIZ
// ═══════════════════════════════════════════════
function wizSay(msg,mood='idle'){
  const wiz=document.getElementById('wiz');
  const bub=document.getElementById('wizBubble');
  wiz.className=`wiz ${mood}`;
  bub.textContent=msg;
  bub.classList.add('show');
  if(mood==='happy'||mood==='sad'){
    setTimeout(()=>{
      wiz.className='wiz idle';
    },1200);
  }
}

// ═══════════════════════════════════════════════
// GAME INIT
// ═══════════════════════════════════════════════
function shuffle(a){
  const b=[...a];
  for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}
  return b;
}

function buildQueue(){
  // pick variety: 3 fill, 2 code, 3 logic, 3 math
  const f=shuffle(FILL).slice(0,3).map(q=>({...q,type:'fill'}));
  const c=shuffle(CODES).slice(0,2).map(q=>({...q,type:'code'}));
  const l=shuffle(LOGIC).slice(0,3).map(q=>({...q,type:'logic'}));
  const m=shuffle(MATH).slice(0,3).map(q=>({...q,type:'math'}));
  const s=shuffle(SIGHT).slice(0,1).map(q=>({...q,type:'sight'}));
  return shuffle([...f,...c,...l,...m,...s]);
}

function startGame(){
  score=0;lives=3;qIdx=0;answered=false;
  queue=buildQueue().slice(0,TOTAL);
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('gameScreen').classList.remove('hidden');
  setScene('day');
  updateHUD();
  renderQ();
}

function restartGame(){
  document.getElementById('endScreen').classList.add('hidden');
  startGame();
}

function updateHUD(){
  document.getElementById('scoreEl').textContent=score;
  document.getElementById('livesEl').textContent=lives>0?'❤️'.repeat(lives):'💔';
  document.getElementById('qEl').textContent=qIdx+1;
  document.getElementById('totalEl').textContent=TOTAL;
  document.getElementById('progBar').style.width=(qIdx/TOTAL*100)+'%';
}

// ═══════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════
function renderQ(){
  answered=false;
  const q=queue[qIdx];
  updateHUD();

  // difficulty dots
  const dr=document.getElementById('diffRow');
  dr.innerHTML='';
  for(let i=1;i<=3;i++){
    const dot=document.createElement('div');
    dot.className='diff-dot'+(i<=q.d?' on':'');
    dr.appendChild(dot);
  }

  // hide all special areas
  document.getElementById('cipherArea').classList.add('hidden');
  document.getElementById('patternArea').classList.add('hidden');
  document.getElementById('emojiCounterWrap').classList.add('hidden');
  document.getElementById('feedback').textContent='';
  document.getElementById('feedback').className='feedback';
  document.getElementById('nextBtn').classList.add('hidden');

  if(q.type==='fill')  renderFill(q);
  else if(q.type==='code')  renderCode(q);
  else if(q.type==='logic') renderLogic(q);
  else if(q.type==='math')  renderMath(q);
  else if(q.type==='sight') renderSight(q);

  // scene
  setScene(q.scene||'day');
  wizSay(WIZ_IDLE[Math.floor(Math.random()*WIZ_IDLE.length)],'idle');
}

// ── FILL IN BLANK ──────────────────────────────
function renderFill(q){
  setBadge('✏️ FILL THE BLANK','badge-fill');
  // display word with blanks
  const blanks=q.display.split('').filter(c=>c==='_').length;
  let html=q.display.split(' ').map(part=>{
    if(part==='_') return `<span class="blank-box">_</span>`;
    return part;
  }).join(' ');
  document.getElementById('qText').innerHTML=
    `<span style="font-size:2.4rem">${q.emoji}</span><br>What letter${blanks>1?'s go':'goes'} in the blank${blanks>1?'s':''}?<br>`+
    `<span class="hl" style="font-size:1.6rem;letter-spacing:6px;">${q.display}</span>`;

  const area=document.getElementById('answersArea');
  area.className='answers g2';
  area.innerHTML='';
  const lcs=['lb1','lb2','lb3','lb4','lb5'];
  shuffle(q.letters).forEach((l,i)=>{
    const btn=document.createElement('button');
    btn.className=`abtn ${['ac1','ac2','ac3','ac4'][i%4]}`;
    btn.textContent=l;
    btn.onclick=()=>handleAnswer(btn,l,q.answer,q);
    area.appendChild(btn);
  });
}

// ── CODE CRACKER ───────────────────────────────
function renderCode(q){
  setBadge('🔐 CODE CRACKER','badge-code');
  document.getElementById('qText').innerHTML=
    `Use the <span class="hl">secret code</span> to decode the word!`;

  // cipher chips
  const cr=document.getElementById('cipherRow');
  cr.innerHTML='';
  Object.entries(q.cipher).forEach(([num,letter])=>{
    const chip=document.createElement('div');
    chip.className='cipher-chip';
    chip.textContent=`${num} = ${letter}`;
    cr.appendChild(chip);
  });

  // encoded cells
  const cw=document.getElementById('codeWord');
  cw.innerHTML='';
  q.encoded.forEach(num=>{
    const cell=document.createElement('div');
    cell.className='code-cell';
    cell.innerHTML=`<div class="code-num">${num}</div><div class="code-letter">?</div>`;
    cw.appendChild(cell);
  });

  document.getElementById('cipherArea').classList.remove('hidden');

  // choices — wrong ones are plausible letter combos
  const area=document.getElementById('answersArea');
  area.className='answers g2';
  area.innerHTML='';
  // build wrong options from cipher letters
  const allLetters=Object.values(q.cipher);
  const wrongs=[];
  while(wrongs.length<3){
    const w=shuffle([...allLetters]).slice(0,q.encoded.length).join('');
    if(w!==q.answer&&!wrongs.includes(w)) wrongs.push(w);
  }
  shuffle([q.answer,...wrongs]).forEach((c,i)=>{
    const btn=document.createElement('button');
    btn.className=`abtn ${['ac1','ac2','ac3','ac4'][i%4]}`;
    btn.textContent=c;
    btn.onclick=()=>{
      // animate decode
      const cells=document.querySelectorAll('.code-letter');
      q.encoded.forEach((num,idx)=>{
        cells[idx].textContent=q.cipher[num];
      });
      handleAnswer(btn,c,q.answer,q);
    };
    area.appendChild(btn);
  });
}

// ── LOGIC / PATTERN ────────────────────────────
function renderLogic(q){
  setBadge('🧩 THINK IT OUT','badge-logic');
  setScene(q.scene||'day');

  if(q.isPattern){
    document.getElementById('qText').innerHTML=q.q;
    const pr=document.getElementById('patternRow');
    pr.innerHTML='';
    q.patternItems.forEach(item=>{
      const cell=document.createElement('div');
      cell.className=item==='❓'?'pattern-cell mystery':'pattern-cell';
      cell.textContent=item;
      pr.appendChild(cell);
    });
    document.getElementById('patternArea').classList.remove('hidden');
  } else {
    document.getElementById('qText').innerHTML=`<span class="hl">${q.q}</span>`;
  }

  const area=document.getElementById('answersArea');
  area.className='answers g2';
  area.innerHTML='';
  shuffle(q.choices).forEach((c,i)=>{
    const btn=document.createElement('button');
    btn.className=`abtn ${['ac1','ac2','ac3','ac4'][i%4]}`;
    btn.textContent=c;
    btn.onclick=()=>handleAnswer(btn,c,q.answer,q);
    area.appendChild(btn);
  });
}

// ── MATH ───────────────────────────────────────
function renderMath(q){
  setBadge('🔢 MATH TIME','badge-math');
  setScene(q.scene||'candy');

  if(q.isSequence){
    document.getElementById('qText').innerHTML=
      `<span class="hl">${q.seq.join('  →  ')} → ___</span><br>${q.q}`;
  } else if(q.op){
    // show emoji counter
    const ctr=document.getElementById('emojiCounter');
    ctr.innerHTML='';
    const total=q.op==='+'?q.count+q.count2:q.count;
    for(let i=0;i<total;i++){
      const span=document.createElement('span');
      span.textContent=q.emoji;
      if(q.op==='-'&&i>=q.count-q.count2) span.style.opacity='0.25';
      ctr.appendChild(span);
    }
    document.getElementById('emojiCounterWrap').classList.remove('hidden');
    document.getElementById('qText').innerHTML=`<span class="hl">${q.q}</span>`;
  } else if(q.count&&!q.op){
    // counting question
    const ctr=document.getElementById('emojiCounter');
    ctr.innerHTML='';
    for(let i=0;i<q.count;i++){
      const span=document.createElement('span');span.textContent=q.emoji;ctr.appendChild(span);
    }
    document.getElementById('emojiCounterWrap').classList.remove('hidden');
    document.getElementById('qText').innerHTML=`<span class="hl">${q.q}</span>`;
  } else {
    document.getElementById('qText').innerHTML=`<span class="hl">${q.q}</span>`;
  }

  const area=document.getElementById('answersArea');
  area.className='answers g2';
  area.innerHTML='';
  shuffle(q.choices).forEach((c,i)=>{
    const btn=document.createElement('button');
    btn.className=`abtn ${['ac1','ac2','ac3','ac4'][i%4]}`;
    btn.textContent=c;
    btn.onclick=()=>handleAnswer(btn,c,q.answer,q);
    area.appendChild(btn);
  });
}

// ── SIGHT WORDS ────────────────────────────────
function renderSight(q){
  setBadge('👁️ SIGHT WORDS','badge-sight');
  document.getElementById('qText').innerHTML=
    `Which one says…<br><span class="hl" style="font-size:2rem;">${q.word}</span>?`;
  const area=document.getElementById('answersArea');
  area.className='answers g2';
  area.innerHTML='';
  shuffle(q.choices).forEach((c,i)=>{
    const btn=document.createElement('button');
    btn.className=`abtn ${['ac1','ac2','ac3','ac4'][i%4]}`;
    btn.textContent=c;
    btn.onclick=()=>handleAnswer(btn,c,q.answer,q);
    area.appendChild(btn);
  });
}

function setBadge(text,cls){
  const b=document.getElementById('cardBadge');
  b.textContent=text;
  b.className=`card-badge ${cls}`;
}

// ═══════════════════════════════════════════════
// ANSWER HANDLING
// ═══════════════════════════════════════════════
function handleAnswer(btn,chosen,correct,q){
  if(answered) return;
  answered=true;
  document.querySelectorAll('.abtn').forEach(b=>b.disabled=true);

  const fb=document.getElementById('feedback');

  if(chosen===correct){
    score++;
    btn.classList.add('correct');
    fb.textContent=WIZ_OK[Math.floor(Math.random()*WIZ_OK.length)];
    fb.className='feedback ok';
    wizSay(WIZ_OK[Math.floor(Math.random()*WIZ_OK.length)],'happy');
    launchConfetti();
    if(q.type==='fill'){
      setTimeout(()=>{
        document.getElementById('qText').innerHTML=
          `<span style="font-size:2rem">${q.emoji}</span><br>`+
          `<span class="hl" style="font-size:2rem;letter-spacing:4px;">✅ ${q.full}</span>`;
      },400);
    }
  } else {
    lives=Math.max(0,lives-1);
    btn.classList.add('wrong');
    fb.textContent=WIZ_NO[Math.floor(Math.random()*WIZ_NO.length)];
    fb.className='feedback no';
    wizSay(WIZ_NO[Math.floor(Math.random()*WIZ_NO.length)],'sad');
    document.querySelectorAll('.abtn').forEach(b=>{
      if(b.textContent===correct) b.classList.add('revealed');
    });
  }

  document.getElementById('scoreEl').textContent=score;
  document.getElementById('livesEl').textContent=lives>0?'❤️'.repeat(lives):'💔';

  setTimeout(()=>document.getElementById('nextBtn').classList.remove('hidden'),700);
}

function nextQ(){
  qIdx++;
  if(qIdx>=TOTAL||lives<=0){
    showEnd();return;
  }
  // re-animate card
  const card=document.getElementById('gameCard');
  card.style.animation='none';
  void card.offsetHeight;
  card.style.animation='';
  renderQ();
}

// END
// ═══════════════════════════════════════════════
function showEnd(){
  document.getElementById('gameScreen').classList.add('hidden');
  const end=document.getElementById('endScreen');
  end.classList.remove('hidden');
  setScene('day');
  const pct=score/TOTAL;
  let emoji,title,msg;
  if(pct>=0.9){emoji='🏆';title='WORD MASTER!';msg=`WOW! ${score}/${TOTAL} stars! Wiz is SO proud of you! You are a superstar! 🌟`;}
  else if(pct>=0.7){emoji='🎉';title='Amazing Work!';msg=`${score}/${TOTAL} stars! You are getting so smart! Keep it up! 📚`;}
  else if(pct>=0.5){emoji='😊';title='Good Try!';msg=`${score}/${TOTAL} stars! Every game makes you smarter — play again! 💪`;}
  else{emoji='🌈';title='Keep Going!';msg=`${score}/${TOTAL} stars. Wiz believes in you — try again! 🦉`;}
  document.getElementById('endEmoji').textContent=emoji;
  document.getElementById('endTitle').textContent=title;
  document.getElementById('endMsg').textContent=msg;
  launchConfetti(50);
  wizSay("You finished! I'm so proud of you! 🦉❤️",'happy');
}

// ═══════════════════════════════════════════════
// CONFETTI
// ═══════════════════════════════════════════════
function launchConfetti(n=20){
  const wrap=document.getElementById('confetti');
  const colors=['#FFD54F','#FF7043','#4FC3F7','#66BB6A','#CE93D8','#7C4DFF','#FF6B4A'];
  for(let i=0;i<n;i++){
    const el=document.createElement('div');
    el.className='cbit';
    el.style.cssText=`left:${Math.random()*100}vw;width:${8+Math.random()*10}px;height:${8+Math.random()*10}px;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${0.9+Math.random()*1.5}s;animation-delay:${Math.random()*0.5}s`;
    wrap.appendChild(el);
    el.addEventListener('animationend',()=>el.remove());
  }
}
