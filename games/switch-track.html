<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Switch Track — Wiz's Adventure 🚂</title>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/switch-track.css">
</head>
<body>

<div id="scene" class="day">
  <div class="sun"></div>
  <div class="moon"></div>
  <div class="stars-wrap" id="starsWrap"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div class="hills">
    <div class="hill hill1"></div>
    <div class="hill hill2"></div>
    <div class="hill hill3"></div>
  </div>
  <div class="tree" style="left:5%;bottom:55px"><div class="tree-top"></div><div class="tree-trunk"></div></div>
  <div class="tree" style="right:8%;bottom:60px"><div class="tree-top" style="width:50px;height:60px"></div><div class="tree-trunk"></div></div>
</div>

<div id="confetti"></div>

<a href="../index.html" class="back-hub">← Home</a>

<div id="app">
  <div class="hdr"><div class="logo">🚂 Switch Track</div></div>

  <div id="wizHost"></div>

  <div id="stGameScreen" style="width:100%">
    <div class="level-dots" id="stLevelDots"></div>

    <div class="card st-card">
      <div class="st-header">
        <div>
          <div class="st-level-label" id="stLevelLabel">Level 1 / 10</div>
          <div class="st-level-name"  id="stLevelName">—</div>
        </div>
        <div class="st-target">
          <span>Goal:</span>
          <span class="st-target-swatch" id="stTargetSwatch"></span>
          <span id="stTargetName">RED</span>
        </div>
      </div>

      <div class="st-hint" id="stHint"></div>

      <div class="board-wrap" id="boardWrap"></div>

      <div class="st-outcome" id="stOutcome"></div>

      <div class="st-controls">
        <button class="st-btn reset" id="stReset">RESET</button>
        <button class="st-btn go"    id="stGo">GO ▶</button>
        <button class="st-btn next hidden" id="stNext">NEXT ➜</button>
      </div>
    </div>
  </div>

  <div id="stEndScreen" class="screen hidden">
    <div class="big-e">🏆</div>
    <h1>Switch Track Master!</h1>
    <p>You reached the station on <span id="stEndScore">0 / 10</span> levels!<br>
       Wiz is so proud of you! 🦉❤️</p>
    <button class="play-btn" id="stPlayAgain">Play Again 🚂</button>
  </div>
</div>

<script src="../js/core/util.js"></script>
<script src="../js/core/scene.js"></script>
<script src="../js/core/wiz.js"></script>
<script src="../js/core/confetti.js"></script>
<script src="../js/switch-track/levels.js"></script>
<script src="../js/switch-track/game.js"></script>
<script>
  KL.wiz.mount(document.getElementById('wizHost'), 'Ready to drive some trains?');
  KL.switchTrack.boot();
</script>
</body>
</html>
