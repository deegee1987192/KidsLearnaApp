<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marble Run — Wiz's Adventure 🏗️</title>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/marble-run.css">
</head>
<body>

<div id="scene" class="day">
  <div class="sun"></div>
  <div class="moon"></div>
  <div class="stars-wrap" id="starsWrap"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div class="hills">
    <div class="hill hill1"></div>
    <div class="hill hill2"></div>
    <div class="hill hill3"></div>
  </div>
  <div class="tree" style="left:5%;bottom:55px"><div class="tree-top"></div><div class="tree-trunk"></div></div>
  <div class="tree" style="right:8%;bottom:60px"><div class="tree-top" style="width:50px;height:60px"></div><div class="tree-trunk"></div></div>
</div>

<div id="confetti"></div>

<a href="../index.html" class="back-hub">&larr; Home</a>

<div id="app">
  <div class="hdr"><div class="logo">🏗️ Marble Run</div></div>

  <div id="wizHost"></div>

  <div id="mrGameScreen" style="width:100%">
    <div class="level-dots" id="mrDots"></div>

    <div class="mr-card" id="mrCard">
      <span class="mr-lvl">Level 1 / 15</span>
      <span class="mr-name">—</span>
    </div>
    <div style="text-align:center"><span class="mr-stars" id="mrStars">⭐ 0</span></div>

    <div class="mr-board">
      <canvas id="mrCanvas" width="360" height="480"></canvas>
    </div>

    <div class="mr-tray" id="mrTray"></div>

    <div class="mr-btns">
      <button class="mr-btn" id="mrGo">▶ GO</button>
      <button class="mr-btn hidden" id="mrRetry">↺ RETRY</button>
      <button class="mr-btn hidden" id="mrNext">NEXT ▶</button>
      <button class="mr-btn hidden" id="mrClear">CLEAR</button>
      <button class="mr-btn hidden" id="mrBack">← BACK</button>
    </div>

    <button class="mr-sandbox-link" id="mrSandboxBtn">🔧 Build Your Own</button>
  </div>

  <div id="mrEndScreen" class="screen hidden">
    <div class="big-e">🏆</div>
    <h1>Amazing Run!</h1>
    <p id="mrEndMsg">You collected 0 stars!</p>
    <button class="play-btn" id="mrRestart">Play Again 🏗️</button>
    <button class="mr-sandbox-link" id="mrEndSandbox">🔧 Build Your Own</button>
  </div>
</div>

<script src="../js/core/util.js"></script>
<script src="../js/core/scene.js"></script>
<script src="../js/core/wiz.js"></script>
<script src="../js/core/confetti.js"></script>
<script src="../js/core/audio.js"></script>
<script src="../js/marble-run/levels.js"></script>
<script src="../js/marble-run/game.js"></script>
<script>
  KL.wiz.mount(document.getElementById('wizHost'), 'Build a path for the marble!');
  KL.marbleRun.boot();
</script>
</body>
</html>
